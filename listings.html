<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Course Listings</title>

    <style>
        .stars {
            color: #f5b301;
            font-size: 18px;
            margin: 5px 0;
        }

        .delete-btn {
            background-color: #990000;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        .contact-btn {
            background-color: #005a9c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            margin-right: 5px;
            font-weight: bold;
            transition: 0.2s;
        }

        .contact-btn:hover {
            background-color: #0073cc;
            transform: scale(1.05);
        }

        .seller-link {
            color: #003366;
            font-weight: bold;
            text-decoration: none;
        }

        .seller-link:hover {
            text-decoration: underline;
        }
        .peer-rating-box {
    margin: 12px 0;
    padding: 12px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
}

.peer-rating-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}

.stars {
    color: #f5b301;
    font-size: 20px;
    letter-spacing: 1px;
    margin: 0;
}

.rating-pill {
    font-size: 12px;
    font-weight: bold;
    padding: 5px 9px;
    border-radius: 999px;
    color: white;
    background: #003366;
}

.rating-meaning {
    font-size: 13px;
    color: #334155;
    margin: 6px 0;
    line-height: 1.4;
}

.rating-scale {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    color: #64748b;
    border-top: 1px solid #e5e7eb;
    padding-top: 8px;
    margin-top: 8px;
}

.rating-none .rating-pill {
    background: #64748b;
}

.rating-low .rating-pill {
    background: #991b1b;
}

.rating-mid .rating-pill {
    background: #ca8a04;
}

.rating-high .rating-pill {
    background: #2563eb;
}

.rating-top .rating-pill {
    background: #15803d;
}
    </style>
</head>

<body class="listings">

<nav class="topbar">
    <a href="mainpage.html" class="logo">
        <img src="umb-logo.png" alt="UMB Exchange Logo">
    </a>
    <div class="nav-links">
        <a href="./mainpage.html">Home</a>
        <a href="./sell.html" class="sell-btn">Sell a Book</a>
        <a href="./messages.html">Messages</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./profile.html">My Profile</a>
    </div>
</nav>

<h2 id="course-title"></h2>
<div id="listings-container"></div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const params = new URLSearchParams(window.location.search);
const course = params.get("course") || null;

document.getElementById("course-title").textContent =
    course ? `Listings for ${course}` : "All Listings";


// ⭐ Convert number → stars
function getRatingInfo(rating) {
    rating = Number(rating);

    if (!rating) {
        return {
            stars: "☆☆☆☆☆",
            label: "No peer rating yet",
            meaning: "Students have not rated how useful this book was yet.",
            className: "rating-none"
        };
    }

    if (rating === 1) {
        return {
            stars: "★☆☆☆☆",
            label: "Not Needed",
            meaning: "Students say this book was barely used or not necessary.",
            className: "rating-low"
        };
    }

    if (rating === 2) {
        return {
            stars: "★★☆☆☆",
            label: "Rarely Used",
            meaning: "Students say this book was only used a few times.",
            className: "rating-low"
        };
    }

    if (rating === 3) {
        return {
            stars: "★★★☆☆",
            label: "Helpful Sometimes",
            meaning: "Students say this book was useful for some assignments or studying.",
            className: "rating-mid"
        };
    }

    if (rating === 4) {
        return {
            stars: "★★★★☆",
            label: "Important",
            meaning: "Students say this book was used often and worth having.",
            className: "rating-high"
        };
    }

    return {
        stars: "★★★★★",
        label: "Essential",
        meaning: "Students say this book was required or very important for success in the class.",
        className: "rating-top"
    };
}

function getStars(rating) {
    const info = getRatingInfo(rating);

    return `
        <div class="peer-rating-box ${info.className}">
            <div class="peer-rating-top">
                <span class="stars">${info.stars}</span>
                <span class="rating-pill">${info.label}</span>
            </div>
            <p class="rating-meaning">${info.meaning}</p>
            <div class="rating-scale">
                <span>1 = Not Needed</span>
                <span>3 = Helpful</span>
                <span>5 = Essential</span>
            </div>
        </div>
    `;
}


// 📩 Contact seller
function contactSeller(sellerId, listingId, courseCode, title) {
    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("You must be logged in.");
        return;
    }

    if (userId == sellerId) {
        alert("This is your listing.");
        return;
    }

    window.location.href =
        `messages.html?receiver_id=${sellerId}&listing_id=${listingId}&course=${courseCode}&title=${encodeURIComponent(title)}`;
}


// 🖼️ Cloudinary image handler
function getImageUrl(image) {
    if (!image) return "placeholder.png";
    return image;
}


// =======================
// LOAD LISTINGS
// =======================
async function loadListings() {
    const url = course ? `/getListings?course=${course}` : '/getListings';
    const res = await fetch(url);
    const data = await res.json();

    const container = document.getElementById("listings-container");
    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = "<p>No listings yet.</p>";
        return;
    }

    const currentUser = localStorage.getItem("userId");

    data.forEach(item => {
        const div = document.createElement("div");
        div.className = "listing-card";

        const imageUrl = getImageUrl(item.image);

        div.innerHTML = `
            <img src="${imageUrl}" class="listing-img"
                 onerror="this.src='placeholder.png'">

            <h4>${item.title}</h4>
            <div class="listing-price">$${item.price}</div>

            <p>${item.book_condition}</p>
            <p>Edition: ${item.edition || "N/A"}</p>

            ${getStars(item.rating)}

            <p>${item.description || ""}</p>

            <div style="margin-top:10px; margin-bottom:10px;">
                <small style="color:gray;">Seller</small><br>

                <a class="seller-link"
                   href="user-profile.html?user_id=${item.seller_id}"
                   style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; margin-top:4px;">

                    <img 
                        src="${item.avatar || 'https://res.cloudinary.com/dx7tpzg3r/image/upload/v1777170742/avatar1_yszcku.png'}"
                        onerror="this.src='https://res.cloudinary.com/dx7tpzg3r/image/upload/v1777170742/avatar1_yszcku.png'"
                        style="width:30px; height:30px; border-radius:50%; object-fit:cover;">

                    <span>${item.username || item.seller_email}</span>
                </a>
            </div>

            <div>
                ${currentUser != item.seller_id ? `
                    <button class="contact-btn"
                        onclick="contactSeller(
                            ${item.seller_id},
                            ${item.id},
                            '${item.course_code}',
                            '${item.title.replace(/'/g, "\\'")}'
                        )">
                        Contact Student
                    </button>
                ` : ""}

                ${currentUser == item.seller_id ? `
                    <button class="delete-btn" onclick="deleteListing(${item.id})">
                        Delete
                    </button>
                ` : ""}
            </div>
        `;

        container.appendChild(div);
    });
}


// 🗑️ Delete listing
async function deleteListing(id) {
    const seller_email = localStorage.getItem("userEmail");

    await fetch("/deleteListing", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, seller_email })
    });

    loadListings();
}


// 🔥 REAL-TIME UPDATE
socket.on("newListing", () => loadListings());

loadListings();
</script>

</body>
</html>
